services:
  db:
    image: postgres:16
    container_name: sistemaloja_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: sistemaloja
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        DATABASE_URL: postgres://admin:admin123@db:5432/sistemaloja
    container_name: sistemaloja_app
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://admin:admin123@db:5432/sistemaloja
      DB_HOST: db
      DB_USER: admin
      DB_PASSWORD: admin123
      DB_NAME: sistemaloja
      DB_PORT: 5432
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata: